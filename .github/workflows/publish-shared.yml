name: Publish @ieomlabs/shared

# Publica automáticamente cuando hay cambios en packages/shared
# Resolución: closes #52 (acoplamiento cross-repo @ieomlabs/shared)
on:
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump version (patch|minor|major)'
        required: false
        default: 'patch'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @ieom/shared build

      - name: Type check
        run: pnpm --filter @ieom/shared typecheck

      - name: Bump version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd packages/shared
          npm version ${BUMP:-patch} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(shared): bump version to $(node -p "require('./package.json').version")"

      - name: Publish to GitHub Packages
        run: pnpm --filter @ieom/shared publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version bump (if any)
        if: github.event_name == 'workflow_dispatch'
        run: git push
