appId: com.ieom.desktop
productName: IEOM
copyright: Copyright © 2024 IEOM

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"

beforePack: ./build/beforePack.cjs
afterPack: ./build/afterPack.cjs

extraResources:
  - from: "../admin/dist"
    to: "admin"
  - from: "../overlay/dist"
    to: "overlay"

asar: true

asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
  - "node_modules/@shinyoshiaki/**"

extraMetadata:
  main: dist/main/index.js

# Use pre-built native binaries (better-sqlite3, etc.)
buildDependenciesFromSource: false

# Electron download mirror for CI environments
electronDownload:
  mirror: https://github.com/electron/electron/releases/download/v

# Include native dependencies in the build
nodeGypRebuild: false
npmRebuild: true

# ─── Windows (NSIS) ───────────────────────────────────────────────────────────

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  signAndEditExecutable: false
  publisherName: IEOM

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IEOM
  uninstallDisplayName: IEOM
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

# ─── macOS (DMG) ──────────────────────────────────────────────────────────────

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Code signing - set CSC_LINK and CSC_KEY_PASSWORD env vars in CI
  # identity: "Developer ID Application: IEOM (TEAM_ID)"
  # Required on macOS 14.2+ (Sonoma) for desktopCapturer to capture system
  # audio via the CoreAudio Tap API — without it the audio track is created
  # but stays silent with no error (see src/main/desktop-audio-capture.ts).
  extendInfo:
    NSAudioCaptureUsageDescription: >-
      IEOM captures system audio so the overlay's audio-reactive effects can
      respond to your screen share.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─── Linux (AppImage) ─────────────────────────────────────────────────────────

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icons
  category: Utility
  mimeTypes:
    - x-scheme-handler/ieom
  desktop:
    Name: IEOM
    Comment: Interactive Experience Overlay Manager
    MimeType: x-scheme-handler/ieom
    Categories: Utility;AudioVideo;

# ─── Protocol Registration ────────────────────────────────────────────────────

protocols:
  name: IEOM Protocol
  schemes:
    - ieom

# ─── Auto-Update Publish Settings ────────────────────────────────────────────

publish:
  provider: generic
  url: https://updates.ieom.app
  channel: latest
