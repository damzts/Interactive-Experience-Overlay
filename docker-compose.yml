version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ieom-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ieom
      POSTGRES_PASSWORD: ieom_dev
      POSTGRES_DB: ieom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ieom']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
